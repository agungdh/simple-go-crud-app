openapi: 3.1.0

info:
  title: Simple Go CRUD API
  version: 0.4.0
  description: |
    Kontrak API untuk entitas `bidang` dan `pegawai`.

    Dokumen ini hanya memuat hal yang dibutuhkan konsumen: bentuk request dan
    response, aturan validasi, serta status yang mungkin diterima.

    - Response `GET` sukses selalu dibungkus `{"data": ...}`.
    - `POST` sukses membalas `201` dan `PUT` sukses membalas `200`, keduanya
      tanpa body; data yang dibuat atau diubah tidak dikembalikan (sejak
      `0.2.0`). Ambil datanya lewat endpoint `GET` bila dibutuhkan.
    - Error `400`, `404`, dan `500` (nanti `401`/`403`) memakai
      `{"error": "pesan"}` yang aman ditampilkan ke pengguna.
    - Error validasi (`422`) memakai
      `{"error": {"validations": {"<field>": ["pesan", ...]}}}` (sejak
      `0.4.0`); satu field bisa punya beberapa pesan.
    - Status error yang dipakai hanya `400`, `401`, `403`, `404`, `422`, dan
      `500`. `401`/`403` menyusul saat autentikasi/otorisasi ditambahkan.
    - `400` berarti body request tidak terbaca: JSON rusak, bukan satu objek
      JSON, lebih dari satu nilai, body kosong, atau body melebihi 1 MiB.
    - `422` berarti body terbaca tetapi isinya tidak valid: tipe salah, field
      tidak dikenal, `id` bukan bilangan bulat positif, field wajib kosong,
      panjang melebihi batas, tanggal tidak valid, atau `q` di luar 3–100
      karakter.
    - `404` berarti data dengan `id` tersebut tidak ditemukan.
    - `500` berarti terjadi kesalahan di server; detailnya tidak disertakan.
    - Tanggal pada response berformat `DD-MM-YYYY`; request menerima
      `DD-MM-YYYY` maupun `YYYY-MM-DD`.
    - `DELETE` membalas `204` tanpa body.
  license:
    name: Proprietary

servers:
  - url: http://127.0.0.1:8080
    description: Development lokal

tags:
  - name: bidang
    description: Data bidang/departemen
  - name: pegawai
    description: Data pegawai, selalu terikat ke satu bidang

paths:
  /bidang:
    get:
      operationId: listBidang
      summary: Daftar bidang
      tags: [bidang]
      parameters:
        - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: Daftar bidang
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BidangListResponse' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      operationId: createBidang
      summary: Tambah bidang
      tags: [bidang]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BidangInput' }
      responses:
        '201':
          description: |
            Bidang dibuat. Response tanpa body dan tidak mengembalikan data
            sejak `0.2.0`; gunakan `GET /bidang/{id}` bila butuh detail.
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /bidang/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getBidang
      summary: Detail bidang
      tags: [bidang]
      responses:
        '200':
          description: Bidang ditemukan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BidangResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      operationId: updateBidang
      summary: Ubah bidang
      tags: [bidang]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BidangInput' }
      responses:
        '200':
          description: |
            Bidang diperbarui. Response tanpa body dan tidak mengembalikan data
            sejak `0.2.0`.
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      operationId: deleteBidang
      summary: Hapus bidang
      tags: [bidang]
      responses:
        '204':
          description: Bidang berhasil dihapus
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /pegawai:
    get:
      operationId: listPegawai
      summary: Daftar pegawai
      tags: [pegawai]
      parameters:
        - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: Daftar pegawai
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PegawaiListResponse' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      operationId: createPegawai
      summary: Tambah pegawai
      tags: [pegawai]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PegawaiInput' }
      responses:
        '201':
          description: |
            Pegawai dibuat. Response tanpa body dan tidak mengembalikan data
            sejak `0.2.0`; gunakan `GET /pegawai/{id}` bila butuh detail.
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /pegawai/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getPegawai
      summary: Detail pegawai
      tags: [pegawai]
      responses:
        '200':
          description: Pegawai ditemukan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PegawaiResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      operationId: updatePegawai
      summary: Ubah pegawai
      tags: [pegawai]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PegawaiInput' }
      responses:
        '200':
          description: |
            Pegawai diperbarui. Response tanpa body dan tidak mengembalikan
            data sejak `0.2.0`.
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      operationId: deletePegawai
      summary: Hapus pegawai
      tags: [pegawai]
      responses:
        '204':
          description: Pegawai berhasil dihapus
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  parameters:
    Q:
      name: q
      in: query
      required: false
      description: |
        Kata kunci pencarian. Kosong atau hanya whitespace berarti tanpa filter.
        Panjang 3–100 karakter; di luar itu dibalas `422`.
      schema:
        type: string
        maxLength: 100
        examples: [keuangan]
    ID:
      name: id
      in: path
      required: true
      description: |
        ID data. Nilai yang bukan bilangan bulat positif dibalas `422`.
      schema:
        type: integer
        format: int64
        minimum: 1
        examples: [1]

  responses:
    NotFound:
      description: Data dengan `id` tersebut tidak ditemukan.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: Data dengan id tersebut tidak ditemukan.
    BadRequest:
      description: |
        Body request tidak terbaca: JSON rusak, bukan satu objek JSON, lebih dari
        satu nilai, body kosong, atau melebihi 1 MiB. Response memakai
        `{"error": "..."}`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: Body request tidak terbaca.
    UnprocessableEntity:
      description: |
        Body terbaca sebagai satu objek JSON, tetapi isinya tidak valid. Response
        selalu `{"error": {"validations": {...}}}` dengan key nama field JSON dan
        value daftar pesan (satu field bisa lebih dari satu pesan); field yang
        valid tidak muncul.

        Mencakup tipe field salah, field tidak dikenal, `id` tidak valid, field
        wajib kosong, melebihi panjang maksimum, tanggal tidak valid, dan `q` di
        luar 3–100 karakter.

        Sejak `0.4.0` error validasi memakai `error.validations`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorResponse' }
          example:
            error:
              validations:
                bidang:
                  - Bidang wajib diisi.
                  - Bidang maksimal 150 karakter.
    InternalServerError:
      description: |
        Terjadi kesalahan di server. Detail tidak disertakan; hubungi admin bila
        berulang.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: Terjadi kesalahan di server.

  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          description: Pesan error yang aman ditampilkan.

    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [validations]
          properties:
            validations:
              type: object
              minProperties: 1
              description: |
                Pesan validasi per field. Key adalah nama field JSON. Value
                selalu array pesan, minimal satu. Field yang valid tidak muncul.
              additionalProperties:
                type: array
                minItems: 1
                items:
                  type: string
                  minLength: 1

    Bidang:
      type: object
      additionalProperties: false
      required: [id, bidang]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: ID bidang.
        bidang:
          type: string
          minLength: 1
          maxLength: 150
          examples: [Keuangan]

    BidangInput:
      type: object
      additionalProperties: false
      required: [bidang]
      properties:
        bidang:
          type: string
          minLength: 1
          maxLength: 150
          description: |
            Spasi di awal/akhir diabaikan. Kosong atau lebih dari 150 karakter
            dibalas `422`.
          examples: [Keuangan]

    BidangResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Bidang' }

    BidangListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          description: Selalu array, kosong (`[]`) bila tidak ada hasil.
          items: { $ref: '#/components/schemas/Bidang' }

    JenisKelaminInput:
      type: string
      enum: [pria, wanita]
      description: |
        Label jenis kelamin. Perbandingan tidak membedakan huruf besar/kecil;
        nilai lain dibalas `422`.

    JenisKelamin:
      type: string
      enum: [Pria, Wanita]
      description: Label jenis kelamin pada response, selalu berawalan huruf besar.

    TanggalLahirInput:
      type: string
      pattern: '^(\d{2}-\d{2}-\d{4}|\d{4}-\d{2}-\d{2})$'
      description: |
        Menerima `DD-MM-YYYY` atau `YYYY-MM-DD`. Tanggal di masa depan dibalas
        `422`.
      examples: ['17-08-1990', '1990-08-17']

    TanggalLahir:
      type: string
      pattern: '^\d{2}-\d{2}-\d{4}$'
      description: Tanggal lahir pada response, selalu `DD-MM-YYYY`.
      examples: ['17-08-1990']

    Pegawai:
      type: object
      additionalProperties: false
      required: [id, bidang_id, nama, nip, tanggal_lahir, alamat, jenis_kelamin]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: ID pegawai.
        bidang_id:
          type: integer
          format: int64
          minimum: 1
          description: ID bidang tempat pegawai berada.
        nama:
          type: string
          minLength: 1
          maxLength: 150
        nip:
          type: string
          minLength: 1
          maxLength: 50
          description: Harus unik.
        tanggal_lahir: { $ref: '#/components/schemas/TanggalLahir' }
        alamat:
          type: string
          minLength: 1
          maxLength: 500
        jenis_kelamin: { $ref: '#/components/schemas/JenisKelamin' }

    PegawaiInput:
      type: object
      additionalProperties: false
      required: [bidang_id, nama, nip, tanggal_lahir, alamat, jenis_kelamin]
      properties:
        bidang_id:
          type: integer
          format: int64
          minimum: 1
          description: ID bidang tempat pegawai berada.
        nama:
          type: string
          minLength: 1
          maxLength: 150
        nip:
          type: string
          minLength: 1
          maxLength: 50
          description: Harus unik.
        tanggal_lahir: { $ref: '#/components/schemas/TanggalLahirInput' }
        alamat:
          type: string
          minLength: 1
          maxLength: 500
        jenis_kelamin: { $ref: '#/components/schemas/JenisKelaminInput' }

    PegawaiResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Pegawai' }

    PegawaiListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          description: Selalu array, kosong (`[]`) bila tidak ada hasil.
          items: { $ref: '#/components/schemas/Pegawai' }
