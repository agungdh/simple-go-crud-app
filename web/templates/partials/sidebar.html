{{define "sidebar"}}
  <aside class="main-sidebar">
    <!-- sidebar: style can be found in sidebar.less -->
    <section class="sidebar">
      <!-- Sidebar user panel -->
      <div class="user-panel">
        <div class="pull-left image">
          <img src="/dist/img/user2-160x160.jpg" class="img-circle" alt="User Image">
        </div>
        <div class="pull-left info">
          <p>Alexander Pierce</p>
          <a href="#"><i class="fa fa-circle text-success"></i> Online</a>
        </div>
      </div>
      <!-- search form -->
      <form action="#" method="get" class="sidebar-form">
        <div class="input-group">
          <input type="text" name="q" class="form-control" placeholder="Search...">
          <span class="input-group-btn">
                <button type="submit" name="search" id="search-btn" class="btn btn-flat">
                  <i class="fa fa-search"></i>
                </button>
              </span>
        </div>
      </form>
      <!-- /.search form -->
      <!-- sidebar menu: : style can be found in sidebar.less -->
      <ul class="sidebar-menu" data-widget="tree">
        <li class="header">MAIN NAVIGATION</li>
        <li{{if eq .Active "starter"}} class="active"{{end}}>
          <a href="/starter.html">
            <i class="fa fa-dashboard"></i> <span>Starter</span>
          </a>
        </li>
        <li class="{{if hasPrefix .Active "examples-"}}active treeview menu-open{{else}}treeview{{end}}">
          <a href="#">
            <i class="fa fa-folder"></i> <span>Examples</span>
            <span class="pull-right-container">
              <i class="fa fa-angle-left pull-right"></i>
            </span>
          </a>
          <ul class="treeview-menu">
            <li{{if eq .Active "examples-404"}} class="active"{{end}}><a href="/pages/examples/404.html"><i class="fa fa-circle-o"></i> 404 Error</a></li>
            <li{{if eq .Active "examples-500"}} class="active"{{end}}><a href="/pages/examples/500.html"><i class="fa fa-circle-o"></i> 500 Error</a></li>
          </ul>
        </li>
      </ul>
    </section>
    <!-- /.sidebar -->
  </aside>
{{end}}
