{{define "sidebar"}}
  <aside class="main-sidebar">
    <!-- sidebar: style can be found in sidebar.less -->
    <section class="sidebar">
      <!-- sidebar menu: : style can be found in sidebar.less -->
      <ul class="sidebar-menu" data-widget="tree">
        <li class="header">MAIN NAVIGATION</li>
        <li{{if eq .Active "pegawai"}} class="active"{{end}}>
          <a href="/pegawai">
            <i class="fa fa-users"></i> <span>Pegawai</span>
          </a>
        </li>
        <li{{if eq .Active "bidang"}} class="active"{{end}}>
          <a href="/bidang">
            <i class="fa fa-sitemap"></i> <span>Bidang</span>
          </a>
        </li>
        <li class="{{if hasPrefix .Active "examples-"}}active treeview menu-open{{else}}treeview{{end}}">
          <a href="#">
            <i class="fa fa-folder"></i> <span>Examples</span>
            <span class="pull-right-container">
              <i class="fa fa-angle-left pull-right"></i>
            </span>
          </a>
          <ul class="treeview-menu">
            <li{{if eq .Active "examples-404"}} class="active"{{end}}><a href="/pages/examples/404.html"><i class="fa fa-circle-o"></i> 404 Error</a></li>
            <li{{if eq .Active "examples-500"}} class="active"{{end}}><a href="/pages/examples/500.html"><i class="fa fa-circle-o"></i> 500 Error</a></li>
          </ul>
        </li>
      </ul>
    </section>
    <!-- /.sidebar -->
  </aside>
{{end}}
